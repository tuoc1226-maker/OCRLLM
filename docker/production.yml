version: "3.9"

services:

  api:

    image: ocrllm-api:latest

    container_name: ocrllm-production

    restart: always

    ports:
      - "8000:8000"


    environment:

      DATABASE_URL: ${DATABASE_URL}

      AWS_REGION: ${AWS_REGION}

      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      LLM_API_KEY: ${LLM_API_KEY}


    logging:

      driver: awslogs

      options:

        awslogs-region: ap-northeast-1

        awslogs-group: ocrllm-production

        awslogs-stream: api